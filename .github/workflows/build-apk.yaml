name: Build ISQU AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
      - name: Install NDK r30 & Build APK
        run: |
          android sdk install ndk@30.0.16248370 platforms/android-37.0 build-tools@37.0.0
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: isqu-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
